<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,X,Lg=[],busy=0,PV={},ES=0;
const GN={A:'Tăng điểm trực tiếp',B:'Nhân đôi & điều kiện',C:'Cướp & hút điểm',D:'Tráo đổi điểm',E:'Trừ điểm',F:'Chia sẻ điểm',G:'Phòng thủ & phản đòn',H:'Khiên bảo vệ',I:'May mắn & bốc lại',J:'Hiệu ứng kéo dài',K:'Nhiệm vụ'},TN={g:'Có lợi',b:'Bất lợi',n:'Trung tính'},KN={a:'Tự động',t:'Chọn mục tiêu',r:'Tương tác'};
const FI={bomb:'💣',frz:'🧊',drn:'💸',ref:'🪞',prx:'↪️',pdn:'🕊️',dis:'🚫',x3:'✖️3',skp:'⏭️'},FN={bomb:'Bom: nổ sau mỗi 2 lượt quay hợp lệ của người đang giữ; chuyển bom đặt lại bộ đếm',frz:'Đóng băng (không nhận điểm cộng)',drn:'Chuyển 50% điểm nhận được',ref:'Phản đòn',prx:'Chuyển hình phạt',pdn:'Bỏ qua 1 lần phạt',dis:'Khiên bị vô hiệu hóa',x3:'Vòng sau trả lời đúng x3 (GV áp dụng)',skp:'Mất lượt: lần bấm quay kế tiếp bị tiêu thụ, không rút phiếu và không tính lượt quay hợp lệ'};
const FG={bomb:'b',frz:'b',drn:'b',dis:'b',ref:'g',prx:'g',pdn:'g',x3:'g',skp:'b'},GI={A:'💰',B:'✖️',C:'🏴‍☠️',D:'🔄',E:'💥',F:'🤝',G:'🛡️',H:'🛡️',I:'🎲',J:'⏳',K:'🎯'},AV=['🦊','🐼','🐯','🐸','🦄','🐙','🐰','🐵','🐱','🐶','🦁','🐧'];
const P=id=>S.st.find(p=>p.id===id),log=s=>(qlb(),Lg.push(s)),M=()=>X.me,rk=()=>[...S.st].sort((a,b)=>b.p-a.p),oth=()=>S.st.filter(p=>p!==X.me),rnd=n=>1+Math.floor(Math.random()*n),fz=p=>p.fx.some(f=>f.k==='frz'),sk=m=>{log('⚠ '+m);throw'skip'};
const uid=()=>{let i;do i='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);while(S&&P(i));return i};
// ===== Lõi điểm: mọi thay đổi đều đi qua gain/lose/T/SW =====
function gain(p,n,src='c',nb=0){n=Math.floor(n);if(n<=0)return 0;if(src!=='m'&&fz(p)){log(`🧊 ${p.n} bị đóng băng, không nhận +${n}`);return 0}if(!nb&&p===X.me&&X.m>1&&!X.bd){const base=n,b=base*X.m;log(`✖️${X.m} Phiếu nhân điểm: +${base} → +${b} (áp dụng một lần)`);n=b;X.bd=1}if(src!=='m'){const d=p.fx.find(f=>f.k==='drn'),o=d&&P(d.o);if(o&&o!==p){const h=Math.floor(n/2);if(h){o.p+=h;n-=h;log(`💸 ${o.n} nhận ${h} điểm từ hiệu ứng chuyển 50%`)}}}log(`${p.n}: +${n} (${p.p}→${p.p+n})`);p.p+=n;return n}
function lose(p,n,att,blk=1,dp=0){n=Math.floor(S.neg?n:Math.min(n,Math.max(0,p.p)));if(n<=0)return 0;const f=k=>p.fx.find(x=>x.k===k),rm=x=>p.fx.splice(p.fx.indexOf(x),1),atk=att&&att!==p;let x;
 // Shield protects ordinary eligible losses and theft. Direct score-setting passes dp=1 or blk=0 explicitly.
 if(blk&&p.sh>0&&!f('dis')){log(`🛡️ Khiên của ${p.n} chặn ${n} điểm mất`);return 0}
 if(!dp&&atk&&(x=f('ref'))){log(`🪞 ${p.n} phản đòn khoản phạt ${n} điểm về ${att.n} (chỉ phản một lần)`);lose(att,n,null,blk,1);return 0}
 if(!dp&&!att&&p===X.me&&(x=f('prx'))){rm(x);const r=rk(),t=x.d==='top'?(r[0]!==p?r[0]:r[1]):P(x.d);if(t&&t!==p){log(`↪️ ${t.n} gánh phạt thay ${p.n}`);lose(t,n,null,blk,1);return 0}log(`↪️ Không có người gánh phạt hợp lệ: ${p.n} tự chịu`)}
 if(!dp&&(x=f('pdn'))){rm(x);log(`🕊️ ${p.n} bỏ qua hình phạt ${n} điểm`);if(atk){const paid=lose(att,10,p,1,1);if(paid)gain(p,paid,'c',1)}return 0}
 log(`${p.n}: -${n} (${p.p}→${p.p-n})`);p.p-=n;return n}

const T=(f,t,n)=>{const taken=lose(f,n,t);if(taken>0)gain(t,taken,'c',1);return taken},G=(p,n)=>gain(p,n),GX=(p,n)=>gain(p,n,'c',1),setp=(p,v)=>{log(`${p.n}: ${p.p}→${v}`);p.p=v},addSh=(p,n)=>{log(`${p.n}: 🛡️ ${p.sh}→${p.sh+n}`);p.sh+=n};
const mv=(f,t,n)=>{if(fz(t))return log('🧊 Người nhận bị đóng băng: hủy');gain(t,lose(f,n,null,0,1),'c',1)};
function SW(a,b){if(!a||!b||a===b)sk('Cần hai người khác nhau');log(`🔄 ${a.n} (${a.p}) ⇄ ${b.n} (${b.p})`);[a.p,b.p]=[b.p,a.p]}

 const buckets={g:rest.filter(c=>c.t==='g'),b:rest.filter(c=>c.t==='b'),n:rest.filter(c=>c.t==='n')};
 const ordered=[],pattern=['g','b','n','g','b','n','g','g','b','n'];let pi=0,guard=0;
 while(ordered.length<rest.length&&guard++<rest.length*5){
   let type=pattern[pi++%pattern.length];
   if(!buckets[type].length) type=['g','b','n'].find(k=>buckets[k].length);
   if(!type)break;
   // Tránh ba phiếu cùng tính chất liên tiếp khi còn lựa chọn khác.
   const last=ordered.slice(-2);
   if(last.length===2&&last.every(c=>c.t===type)){
     const alt=['g','b','n'].find(k=>buckets[k].length&&k!==type);
     if(alt)type=alt;
   }
   ordered.push(buckets[type].shift());

 // Rải các phiếu liên quan đến Khiên ra xa nhau, thay vì để thành một cụm.
 const gap=Math.max(7,Math.floor((ordered.length+1)/(shields.length+1)));
 shields.forEach((c,i)=>{
   let at=Math.min(ordered.length,Math.round((i+1)*(ordered.length+1)/(shields.length+1))-1);
   at=Math.max(0,at);
   // Nếu vị trí dự kiến quá gần Khiên đã chèn, dịch đến vị trí hợp lệ gần nhất.
   const occupied=()=>shields.slice(0,i).some((_,j)=>Math.abs((shields[j]._orderPos??-1000)-at)<gap);
   let tries=0;
   while(tries++<ordered.length&&!shields.slice(0,i).every((_,j)=>Math.abs((shields[j]._orderPos??-1000)-at)>=gap)){
     at=at+1<=ordered.length?at+1:Math.max(0,at-2);
   }
   ordered.splice(at,0,c);c._orderPos=at;
   // Cập nhật vị trí ghi nhớ của những Khiên đã đặt khi chèn làm dịch chuyển chúng.
   shields.slice(0,i).forEach(sh=>{if(sh._orderPos>=at)sh._orderPos++});
 });

 C.splice(0,C.length,...ordered);
})();

function mng(){const rows=()=>{const q=$('#fq').value.toLowerCase(),g=$('#fg').value,t=$('#ft').value,s=pool().reduce((a,c)=>a+cf(c).w,0)||1;return C.filter(c=>(!g||c.g===g)&&(!t||c.t===t)&&txt(c).toLowerCase().includes(q)).map(c=>{const f=cf(c);return `<tr class="t${c.t}"><td>${c.id}</td><td class="tx"><textarea rows="2" data-i="${c.id}" data-f="x">${esc(txt(c))}</textarea></td><td>${TN[c.t]}<br><small>${KN[c.k]}</small></td><td><input type="checkbox" data-i="${c.id}" data-f="on" ${f.on?'checked':''}></td><td><input type="number" min="0" style="width:70px" data-i="${c.id}" data-f="w" value="${f.w}"><small>${f.on&&f.w>0?(f.w/s*100).toFixed(1):0}%</small></td></tr>`}).join('')};
 dlg(`<h3>Quản lý phiếu (${C.length})</h3><div class="fl"><input id="fq" placeholder="Tìm theo tên"><select id="fg"><option value="">Mọi nhóm</option>${Object.entries(GN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="ft"><option value="">Tốt/xấu/trung tính</option>${Object.entries(TN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="tw"><table id="rw"></table></div>`,[['Khôi phục mặc định',()=>{S.cf={};save();return 1}],['Đóng',1,'p']],()=>{const up=()=>$('#rw').innerHTML=rows();['fq','fg','ft'].forEach(i=>$('#'+i).oninput=up);$('#rw').onchange=e=>{const t=e.target,c=C.find(c=>c.id===t.dataset.i),f=cf(c);if(t.dataset.f==='on')f.on=t.checked?1:0;else if(t.dataset.f==='w')f.w=Math.max(0,+t.value||0);else f.x=t.value.trim()||undefined;save();up()};up()},'1250px')}
document.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const{a,i,n}=b.dataset;({spin:()=>spin(i),add:()=>txn(`+${n} cho ${P(i).n}`,()=>gain(P(i),+n,'q')),edit:()=>edit(i),del:()=>del(i),undo,hist,mng,cadd:()=>cls('add'),cren:()=>cls('ren'),cdel:()=>cls('del'),nr:()=>txn('Bắt đầu vòng mới',()=>{S.sp=[];log('Đã đặt lại trạng thái đã quay của cả lớp')}),ex:()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([ser()],{type:'application/json'}));l.download='quiz-battle-backup.json';l.click()}})[a]?.()};

$('#ng').checked=S.neg;$('#fo').checked=S.fo;$('#qa').checked=S.qa;document.body.classList.toggle('nofx',S.fo);$('#qa').onchange=e=>{S.qa=e.target.checked;save();render()};$('#ng').onchange=e=>{S.neg=e.target.checked;save()};$('#fo').onchange=e=>{S.fo=e.target.checked;document.body.classList.toggle('nofx',S.fo);save()};
document.onchange=e=>{const t=e.target;if(t.id==='cs')return swc(t.value);if(t.dataset.a2!=='sc')return;const p=P(t.dataset.i),v=t.value.trim()===''?NaN:Math.floor(+t.value);if(!p||!Number.isFinite(v)||(!S.neg&&v<0)){render();return}if(v!==p.p)txn(`Nhập tay điểm ${p.n}`,()=>{log(`✏️ Giáo viên đặt điểm trực tiếp ${p.n}: ${p.p}→${v}; không kích hoạt khiên, phản đòn hoặc đóng băng`);p.p=v})};
